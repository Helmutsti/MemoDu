[package]
name = "memodu"
version = "0.1.11"
description = "Memodu"
authors = ["Manuel Cucca"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memodu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Avvio all'accensione dalle impostazioni (DEC-91).
tauri-plugin-autostart = "2"
# Nome del computer, il nome di default del dispositivo (RB-51).
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Copia di lavoro delle note sul dispositivo (DEC-67): SQLite incorporato, senza servizi.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
# Richieste della sincronizzazione al server (DEC-75).
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
unicode-normalization = "0.1"
# Locale, i file del disco (RF-17, DEC-118): scelta della cartella, cambi fatti da altri
# programmi, impronta del contenuto letto, file in Windows-1252, Cestino del sistema.
tauri-plugin-dialog = "2"
notify-debouncer-full = "0.7"
sha2 = "0.10"
encoding_rs = "0.8"
trash = "5"
# Accesso e cifratura end-to-end (DEC-121): Argon2id dalla password, HKDF per le chiavi separate,
# XChaCha20-Poly1305 per i blocchi e la chiave dati, portachiavi del sistema per gettone e chiave.
argon2 = "0.5"
hkdf = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }


# Tema della barra delle applicazioni di Windows, per il colore dell'icona nell'area di notifica.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
