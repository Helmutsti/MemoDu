# Compila Memodu per Windows e macOS (solo Apple Silicon, per ora niente Intel) e allega gli
# installatori a una release su GitHub:
# - spingendo un tag v* (per esempio v0.1.0): crea e pubblica la release «Memodu v0.1.0»;
# - pubblicando una release dal sito: gli installatori vanno in quella;
# - a mano dalla scheda Actions: una release in bozza con la versione di tauri.conf.json.
# La versione in client/src-tauri/tauri.conf.json deve corrispondere al tag.
#
# Gli installatori non sono firmati: Windows mostra l'avviso di SmartScreen («Ulteriori
# informazioni» → «Esegui comunque»), macOS chiede di aprire l'app con il tasto destro → Apri.

name: Rilascio

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compila:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            sistema: windows-latest
            argomenti: ""
            bersaglio: ""
          - nome: macOS (Apple Silicon)
            sistema: macos-latest
            argomenti: --target aarch64-apple-darwin
            bersaglio: aarch64-apple-darwin
    runs-on: ${{ matrix.sistema }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.bersaglio }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Dipendenze
        run: npm ci

      - name: Prove
        run: |
          npm test
          cargo test --manifest-path client/src-tauri/Cargo.toml

      - name: Compila e allega alla release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.argomenti }}
          # Pubblicata una release dal sito: gli installatori vanno in quella.
          releaseId: ${{ github.event.release.id }}
          # Tag spinto: la release con quel nome; lanciata a mano: con la versione dell'app.
          tagName: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'workflow_dispatch' && 'v__VERSION__' || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Memodu {0}', github.ref_name) || github.event_name == 'workflow_dispatch' && 'Memodu v__VERSION__' || '' }}
          # A mano resta in bozza; con il tag si pubblica subito.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
